# This is a basic configuration that can easily be adapted to suit a standard
# installation. For more advanced options, see opendkim.conf(5) and/or
# /usr/share/doc/opendkim/examples/opendkim.conf.sample.

# Log to syslog
Syslog			yes
# Required to use local socket with MTAs that access the socket as a non-
# privileged user (e.g. Postfix)
UMask			007

# Sign for example.com with key in /etc/dkimkeys/dkim.key using
# selector '2007' (e.g. 2007._domainkey.example.com)
#Domain			example.com
#KeyFile		/etc/dkimkeys/dkim.key
#Selector		2007

# Commonly-used options; the commented-out versions show the defaults.
#Canonicalization	simple
Mode			sv
#SubDomains		no

# Socket smtp://localhost
#
# ##  Socket socketspec
# ##
# ##  Names the socket where this filter should listen for milter connections
# ##  from the MTA.  Required.  Should be in one of these forms:
# ##
# ##  inet:port@address           to listen on a specific interface
# ##  inet:port                   to listen on all interfaces
# ##  local:/path/to/socket       to listen on a UNIX domain socket
#
Socket                  inet:12345@127.0.0.1
#Socket			local:/var/run/opendkim/opendkim.sock

##  PidFile filename
###      default (none)
###
###  Name of the file where the filter should write its pid before beginning
###  normal operations.
#
PidFile               /var/run/opendkim/opendkim.pid


# Always oversign From (sign using actual From and a null From to prevent
# malicious signatures header fields (From and/or others) between the signer
# and the verifier.  From is oversigned by default in the Debian pacakge
# because it is often the identity key used by reputation systems and thus
# somewhat security sensitive.
OversignHeaders		From

##  ResolverConfiguration filename
##      default (none)
##
##  Specifies a configuration file to be passed to the Unbound library that
##  performs DNS queries applying the DNSSEC protocol.  See the Unbound
##  documentation at http://unbound.net for the expected content of this file.
##  The results of using this and the TrustAnchorFile setting at the same
##  time are undefined.
##  In Debian, /etc/unbound/unbound.conf is shipped as part of the Suggested
##  unbound package

# ResolverConfiguration     /etc/unbound/unbound.conf

##  TrustAnchorFile filename
##      default (none)
##
## Specifies a file from which trust anchor data should be read when doing
## DNS queries and applying the DNSSEC protocol.  See the Unbound documentation
## at http://unbound.net for the expected format of this file.

TrustAnchorFile       /usr/share/dns/root.key

##  Userid userid
###      default (none)
###
###  Change to user "userid" before starting normal operation?  May include
###  a group ID as well, separated from the userid by a colon.
#
UserID                opendkim:opendkim

## Settings tipps from
### https://kofler.info/dkim-konfiguration-fuer-postfix/
#
Canonicalization      relaxed/relaxed
InternalHosts         refile:/etc/opendkim/trusted
ExternalIgnoreList    refile:/etc/opendkim/trusted
SigningTable          refile:/etc/opendkim/signing.table
KeyTable              /etc/opendkim/key.table
SignatureAlgorithm    rsa-sha256

##  MTA name
##
##  Sign, rather than verify, mail that Postfix tags as ORIGINATING, which is
##  every SMTP AUTH submission on port 587/465 (see milter_macro_daemon_name in
##  master.cf). Without this, submissions from an external client IP would only
##  be verified, because InternalHosts is deliberately limited to loopback.
#
MTA                   ORIGINATING

##  Error handling
##
##  Nothing in this image consumes the verification result, so a problem while
##  checking an *incoming* message must never reject or defer it. The shipped
##  defaults are aggressive: On-SignatureError rejects, and On-DNSError,
##  On-InternalError and On-Security tempfail.
#
On-SignatureError     accept
On-BadSignature       accept
On-DNSError           accept
On-InternalError      accept
On-KeyNotFound        accept
On-Security           accept