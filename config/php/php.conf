[www]

; Clear environment in FPM workers
; Prevents arbitrary environment variables from reaching FPM worker processes
; by clearing the environment in workers before env vars specified in this
; pool configuration are added.
; Setting to "no" will make all environment variables available to PHP code
; via getenv(), $_ENV and $_SERVER.
; Default Value: yes
clear_env = no

; CVE-2026-109619 (php.net, 2026-10-21): session upload progress was the
; confirmed attack path and is on by default, even without session_start().
; PostfixAdmin and Roundcube do not depend on it; at worst an upload progress
; indicator goes missing. php.net recommends keeping it off after patching.
; A pool php_admin_flag applies before the request is parsed; ini_set() and
; .user.ini would not.
php_admin_flag[session.upload_progress.enabled] = off
