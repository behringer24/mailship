[supervisord]
logfile=/dev/stdout
logfile_maxbytes = 0
nodaemon=true

; Control socket, so that supervisorctl works inside the container. dkim-sync.sh
; needs it to restart opendkim after creating a key.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface.make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postfix]
command=/usr/sbin/postfix -c /etc/postfix start-fg
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false

[program:dovecot]
command=/usr/sbin/dovecot -c /etc/dovecot/dovecot.conf -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false

[program:php-fpm]
command=/usr/sbin/php-fpm7.4 -F -c /etc/php/7.4/fpm/
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false

; Started before postfix so the milter is listening early. Note that supervisord
; spawns in priority order but does not wait for startsecs, so the real
; protection against a startup race is milter_default_action = accept.
;
; Runs as root and drops privileges itself via UserID in opendkim.conf, which
; lets it write the pid file. "-D" was removed: it only signs subdomains of the
; domains given with "-d", which this setup does not use.
[program:opendkim]
command=/usr/sbin/opendkim -f -x /etc/opendkim.conf
priority=10
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Picks up domains added through the Postfixadmin web interface, creates their
; DKIM keys and reminds the postmaster about DNS records that are still missing.
[program:dkim-watch]
command=/bin/sh /usr/local/bin/dkim-watch.sh
priority=90
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
